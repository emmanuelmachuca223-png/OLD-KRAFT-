<!--
  OLD KRAFT · Archivo único.
  El esquema SQL de Supabase está en el bloque <script id="supabase-schema"> más abajo
  (no se ejecuta en el navegador). Cópialo y pégalo en Supabase > SQL Editor > Run.
  Luego completa SUPABASE_URL y SUPABASE_ANON_KEY en el script de configuración.
-->
<script type="text/plain" id="supabase-schema">
-- =====================================================================
-- OLD KRAFT · Esquema de Supabase
-- Ejecutar completo en: Supabase > SQL Editor > New query > Run
-- =====================================================================

-- 1) Tablas -----------------------------------------------------------

-- Un registro por alumno. "id" es texto porque los alumnos registrados
-- solo con nombre usan ids tipo "m1abc23"; los que tienen cuenta usan
-- su auth.uid() como texto.
create table if not exists public.alumnos (
  id         text primary key,
  data       jsonb not null default '{}'::jsonb,   -- rutina, logs, perfil, pesos, fechas
  updated_at timestamptz not null default now()
);

-- Quién es coach (administrador).
create table if not exists public.coaches (
  user_id uuid primary key references auth.users(id) on delete cascade
);

-- Perfil público mínimo para que el coach pueda buscar alumnos por nombre/correo.
create table if not exists public.profiles (
  id    uuid primary key references auth.users(id) on delete cascade,
  email text,
  name  text
);

-- 2) Función auxiliar: ¿el usuario actual es coach? -------------------

create or replace function public.is_coach()
returns boolean
language sql
security definer
set search_path = public
stable
as $$
  select exists (select 1 from public.coaches where user_id = auth.uid());
$$;

-- 3) Crear perfil automáticamente al registrarse ----------------------

create or replace function public.handle_new_user()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  insert into public.profiles (id, email, name)
  values (new.id, new.email, coalesce(new.raw_user_meta_data->>'name', ''))
  on conflict (id) do nothing;
  return new;
end;
$$;

drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function public.handle_new_user();

-- 4) Seguridad por filas (RLS) ----------------------------------------

alter table public.alumnos  enable row level security;
alter table public.coaches  enable row level security;
alter table public.profiles enable row level security;

-- alumnos: el coach ve y edita todo; el alumno solo ve y actualiza lo suyo.
drop policy if exists alumnos_select on public.alumnos;
create policy alumnos_select on public.alumnos
  for select to authenticated
  using (public.is_coach() or (id = auth.uid()::text and coalesce(data->>'activo','true') <> 'false'));

drop policy if exists alumnos_insert on public.alumnos;
create policy alumnos_insert on public.alumnos
  for insert to authenticated
  with check (public.is_coach());

drop policy if exists alumnos_update on public.alumnos;
create policy alumnos_update on public.alumnos
  for update to authenticated
  using (public.is_coach() or (id = auth.uid()::text and coalesce(data->>'activo','true') <> 'false'))
  with check (public.is_coach() or id = auth.uid()::text);

drop policy if exists alumnos_delete on public.alumnos;
create policy alumnos_delete on public.alumnos
  for delete to authenticated
  using (public.is_coach());

-- 4b) Guardia: un alumno (no coach) SOLO puede modificar data->'rpes' -----
-- Sin esto, la política alumnos_update deja al alumno reescribir toda su fila.
create or replace function public.alumnos_guard()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  -- auth.uid() es null en el SQL Editor / service role: se permite.
  if auth.uid() is null or public.is_coach() then
    return new;
  end if;
  if new.id is distinct from old.id then
    raise exception 'No puedes cambiar el id';
  end if;
  if (new.data - 'rpes' - 'msgs') is distinct from (old.data - 'rpes' - 'msgs') then
    raise exception 'Solo puedes modificar tu RPE y tus mensajes';
  end if;
  if jsonb_typeof(new.data->'msgs') not in ('array','null')
     or length(coalesce((new.data->'msgs')::text,'')) > 40000 then
    raise exception 'Mensajes inválidos';
  end if;
  if jsonb_typeof(new.data->'rpes') not in ('array','null')
     or jsonb_array_length(coalesce(new.data->'rpes','[]'::jsonb)) > 5000
     or length(coalesce((new.data->'rpes')::text,'')) > 600000 then
    raise exception 'RPE inválido';
  end if;
  return new;
end;
$$;

drop trigger if exists alumnos_guard_t on public.alumnos;
create trigger alumnos_guard_t
  before update on public.alumnos
  for each row execute function public.alumnos_guard();

-- coaches: cada usuario solo puede consultar si él mismo es coach.
-- (Nadie puede insertar desde la app: se agrega a mano, ver paso 6.)
drop policy if exists coaches_select_self on public.coaches;
create policy coaches_select_self on public.coaches
  for select to authenticated
  using (user_id = auth.uid());

-- profiles: el coach ve todos (para buscar alumnos); cada uno ve el suyo.
drop policy if exists profiles_select on public.profiles;
create policy profiles_select on public.profiles
  for select to authenticated
  using (public.is_coach() or id = auth.uid());

-- 5) Tiempo real ------------------------------------------------------

do $$
begin
  alter publication supabase_realtime add table public.alumnos;
exception when duplicate_object then null;
end $$;

-- 6) Convertirte en coach (ejecutar DESPUÉS de crear tu cuenta en la app)
-- Reemplaza el correo por el tuyo y ejecuta solo esta línea:
--
-- insert into public.coaches (user_id)
-- select id from auth.users where email = 'tu-correo@ejemplo.com';

-- 5) Fotos de perfil en Storage (bucket público "avatars") -------------
insert into storage.buckets (id, name, public) values ('avatars','avatars',true) on conflict (id) do nothing;
drop policy if exists avatars_read on storage.objects;
-- (avatars_read se elimina más abajo: el listado público ya no se permite)
drop policy if exists avatars_write on storage.objects;
create policy avatars_write on storage.objects for insert to authenticated
  with check (bucket_id = 'avatars' and (public.is_coach() or name = auth.uid()::text || '.jpg'));
drop policy if exists avatars_update on storage.objects;
create policy avatars_update on storage.objects for update to authenticated
  using (bucket_id = 'avatars' and (public.is_coach() or name = auth.uid()::text || '.jpg'));
-- 7) Eliminar mi cuenta desde la app --------------------------------
create or replace function public.delete_my_account()
returns void
language plpgsql
security definer
set search_path = public
as $$
declare uid uuid := auth.uid();
begin
  if uid is null then raise exception 'No autenticado'; end if;
  if public.is_coach() then raise exception 'Las cuentas de coach no se eliminan desde la app'; end if;
  delete from public.alumnos where id = uid::text;
  delete from auth.users where id = uid;   -- borra también profiles y push_subscriptions (cascade)
end;
$$;
revoke all on function public.delete_my_account() from public, anon;
grant execute on function public.delete_my_account() to authenticated;

-- 8) Fotos: el alumno puede borrar su foto; se quita el listado público ---
drop policy if exists avatars_read on storage.objects;   -- el bucket sigue público por URL, pero ya no se puede listar
drop policy if exists avatars_delete on storage.objects;
create policy avatars_delete on storage.objects for delete to authenticated
  using (bucket_id = 'avatars' and (public.is_coach() or name = auth.uid()::text || '.jpg'));

-- 9) Suscripciones para notificaciones push --------------------------------
create table if not exists public.push_subscriptions (
  endpoint   text primary key,
  user_id    uuid not null references auth.users(id) on delete cascade,
  p256dh     text not null,
  auth       text not null,
  created_at timestamptz not null default now()
);
alter table public.push_subscriptions enable row level security;
drop policy if exists push_own on public.push_subscriptions;
create policy push_own on public.push_subscriptions for all to authenticated
  using (user_id = auth.uid()) with check (user_id = auth.uid());

-- 10) Registro de errores de la app (los ve solo el coach) ---------------
create table if not exists public.app_errors (
  id         bigint generated always as identity primary key,
  user_id    uuid references auth.users(id) on delete set null,
  msg        text,
  stack      text,
  ua         text,
  url        text,
  created_at timestamptz not null default now()
);
alter table public.app_errors enable row level security;
drop policy if exists errors_insert on public.app_errors;
create policy errors_insert on public.app_errors for insert to authenticated
  with check (user_id = auth.uid());
drop policy if exists errors_select on public.app_errors;
create policy errors_select on public.app_errors for select to authenticated
  using (public.is_coach());

-- 11) Endurecimiento de seguridad ----------------------------------------
-- a) Fotos: el bucket pasa a privado y la app ya no sube archivos (la foto vive dentro
--    del documento del alumno, protegido por las reglas de acceso).
update storage.buckets set public = false where id = 'avatars';
drop policy if exists avatars_write  on storage.objects;
drop policy if exists avatars_update on storage.objects;
-- (avatars_delete se mantiene para que «Eliminar mi cuenta» limpie fotos antiguas)

-- b) Sin sesión no se toca ninguna tabla; desde la app nadie escribe en coaches ni profiles.
revoke all on public.alumnos, public.profiles, public.coaches, public.push_subscriptions, public.app_errors from anon;
revoke insert, update, delete on public.coaches, public.profiles from authenticated;
revoke update, delete on public.app_errors from authenticated;

-- c) Límites de tamaño en el registro de errores (evita que lo llenen de basura).
alter table public.app_errors drop constraint if exists app_errors_len;
alter table public.app_errors add constraint app_errors_len check (
  length(coalesce(msg,'')) <= 300 and length(coalesce(stack,'')) <= 1000
  and length(coalesce(ua,'')) <= 200 and length(coalesce(url,'')) <= 200);

-- d) Verificación en 2 pasos del coach: en cuanto el coach activa su verificación
--    (botón en el pie de la app), sus permisos solo funcionan con sesión verificada (aal2).
--    Antes de activarla todo sigue funcionando igual, así que no hay riesgo de quedar fuera.
create or replace function public.is_coach()
returns boolean
language sql
security definer
set search_path = public
stable
as $$
  select exists (select 1 from public.coaches where user_id = auth.uid())
    and (
      coalesce(auth.jwt()->>'aal', 'aal1') = 'aal2'
      or not exists (select 1 from auth.mfa_factors f where f.user_id = auth.uid() and f.status = 'verified')
    );
$$;

-- 12) Registros ordenados + validación (isométricos con peso) -------------
-- NO hace falta para que la app funcione: el peso de los isométricos se guarda
-- dentro del JSON de cada alumno (campo "kg"), que ya existe. Esto es opcional.
-- Ejecutar en orden: A, luego B (revisar), luego C.

-- A) Vista de solo lectura con un registro por fila (útil para filtrar o exportar).
--    security_invoker = true: respeta las reglas RLS (el coach ve todo, cada alumno lo suyo).
create or replace view public.v_registros with (security_invoker = true) as
select
  a.id                          as alumno_id,
  a.data->>'name'               as alumno,
  (l->>'d')::date               as fecha,
  l->>'ex'                      as ejercicio,
  l->>'type'                    as tipo,       -- reps | lastre | peso | tiempo
  nullif(l->>'sets','')::int    as series,
  nullif(l->>'reps','')::int    as reps,
  nullif(l->>'sec','')::int     as segundos,
  nullif(l->>'kg','')::numeric  as kg,         -- lastre o peso añadido (también en isométricos)
  nullif(l->>'rpe','')::numeric as rpe,
  nullif(l->>'bw','')::numeric  as peso_corporal
from public.alumnos a
cross join lateral jsonb_array_elements(coalesce(a.data->'logs', '[]'::jsonb)) l;

revoke all on public.v_registros from anon;
grant select on public.v_registros to authenticated;

-- B) Revisión previa: si devuelve filas, hay registros fuera de rango.
--    Corrígelos antes de ejecutar C (si no, esos alumnos no podrían guardar).
select * from public.v_registros
where segundos > 3600 or kg > 600 or reps > 200 or series > 20
   or segundos < 0 or kg < 0 or reps < 0 or series < 0;

-- C) Validación en el servidor: rechaza valores imposibles en los registros.
create or replace function public.alumnos_validate_logs()
returns trigger
language plpgsql
set search_path = public
as $$
declare l jsonb;
begin
  if new.data->'logs' is null or jsonb_typeof(new.data->'logs') = 'null' then
    return new;
  end if;
  if jsonb_typeof(new.data->'logs') <> 'array' then
    raise exception 'logs debe ser una lista';
  end if;
  if jsonb_array_length(new.data->'logs') > 5000 then
    raise exception 'Demasiados registros';
  end if;
  for l in select * from jsonb_array_elements(new.data->'logs') loop
    if jsonb_typeof(l) <> 'object' then
      raise exception 'Registro inválido';
    end if;
    if (jsonb_typeof(l->'sec')  = 'number' and ((l->>'sec')::numeric  < 0 or (l->>'sec')::numeric  > 3600))
    or (jsonb_typeof(l->'kg')   = 'number' and ((l->>'kg')::numeric   < 0 or (l->>'kg')::numeric   > 600))
    or (jsonb_typeof(l->'reps') = 'number' and ((l->>'reps')::numeric < 0 or (l->>'reps')::numeric > 200))
    or (jsonb_typeof(l->'sets') = 'number' and ((l->>'sets')::numeric < 0 or (l->>'sets')::numeric > 20))
    then
      raise exception 'Valores fuera de rango en un registro';
    end if;
  end loop;
  return new;
end;
$$;

drop trigger if exists alumnos_validate_logs_t on public.alumnos;
create trigger alumnos_validate_logs_t
  before insert or update on public.alumnos
  for each row execute function public.alumnos_validate_logs();
</script>
</head>

  S.routine.push({day:U.day,name:name,type:f.type,sets:parseInt(f.sets,10)||3,target:parseInt(f.target,10)||10});U.f.name='';save()}
 else if(d.del!==undefined){var di=+d.del,lg0=S.logs[di];if(!lg0)return;ask('¿Borrar el registro de «'+lg0.ex+'» del '+fmt(lg0.d)+'? No se puede deshacer.','Borrar',function(){S.logs.splice(di,1);save();draw()});return}
 else if(d.find){var qq=document.getElementById('as').value.trim();U.q=qq;if(US&&US.search&&qq)US.search(qq).then(function(h){U.hits=(h||[]).slice(0,5);draw()}).catch(function(){U.err='No se pudo buscar. Revisa tu conexión e inténtalo de nuevo.';draw()});else if(!qq)return}
 else if(d.pick!==undefined){var h0=U.hits[+d.pick];if(!h0)return;var nm0=h0.name||U.q;U.hits=[];U.q='';
  if(ALL.some(function(a){return a.id===h0.id})){U.sel=h0.id;U.tab='hoy';U.day=1;U.days=1;sync()}
  else{var old=ALL.filter(function(a){return a.id.charAt(0)==='m'&&String(a.data.name||'').trim().toLowerCase()===String(nm0).trim().toLowerCase()})[0],dt=old?norm(old.data):norm({name:nm0});
   db.doc('alumnos/'+h0.id).set(dt).then(function(){if(old)return db.doc('alumnos/'+old.id).delete()}).catch(function(){U.err='No se pudo registrar al alumno. Revisa tu conexión e inténtalo de nuevo.';draw()})}}
 else if(d.addname){var n1=(document.getElementById('as').value||'').trim();if(!n1)return;U.q='';db.doc('alumnos/m'+Date.now().toString(36)).set(norm({name:n1})).catch(function(){U.err='No se pudo registrar al alumno. Revisa tu conexión e inténtalo de nuevo.';draw()})}
 else if(d.pm!==undefined){U.pm=d.pm;window.scrollTo(0,0)}
 else if(d.mo!==undefined){U.mo=(U.mo!==undefined?U.mo:(evoList().slice(-1)[0]||{}).s)===d.mo?'':d.mo}
 else if(d.closem){var sn=mkSnap();
  if(!sn.days){ask('Este mes no tiene registros todavía, así que no hay nada que guardar. Registra algún entrenamiento o ajusta las fechas.','Entendido',null,true);return}
  var ending=today()<=S.end?' El mes aún no termina (termina el '+fmt(S.end)+').':'';
  ask('Se guardará el resumen de '+fmt(S.start)+' – '+fmt(S.end)+' ('+sn.days+' días entrenados) y comenzará el siguiente mes.'+ending+' Tu rutina y tus registros se mantienen.','Guardar y continuar',function(){
   S.meses=(S.meses||[]).filter(function(m){return m.s!==sn.s});S.meses.push(sn);S.meses.sort(function(a,b){return a.s<b.s?-1:1});
   var len=Math.max(6,diff(S.start,S.end));S.start=add(S.end,1);S.end=add(S.start,len);U.pw=0;U.cfg=false;U.mo=undefined;save();draw()});return}
 else if(d.share){exportImg();return}
 else if(d.backup){ask('Este archivo contiene los datos de todos tus alumnos. Guárdalo en un lugar privado (no en un grupo de WhatsApp ni en un correo) y bórralo cuando ya no lo necesites.','Descargar',function(){dl(new Blob([J({exportado:new Date().toISOString(),alumnos:ALL.map(function(x){return{id:x.id,data:x.data}})})],{type:'application/json'}),'old-kraft-respaldo-'+today()+'.json')});return}
 else if(d.pausa){if(S.activo===false){S.activo=true;save()}else{ask('¿Pausar el acceso de '+(S.name||'este alumno')+'? No podrá entrar a la app hasta que lo reactives. Sus datos se conservan.','Pausar',function(){S.activo=false;save();draw()});return}}
 else if(d.msg){var mt=((document.getElementById('mt')||{}).value||'').trim().slice(0,300);if(!mt)return;S.msgs=(S.msgs||[]).concat([{t:mt,c:new Date().toISOString(),d:today()}]).slice(-30);save()}
 else if(d.note){var nt=((document.getElementById('nt')||{}).value||'').trim().slice(0,400);if(!nt)return;S.nota={t:nt,d:today(),c:new Date().toISOString()};S.notas=(S.notas||[]).concat([S.nota]).slice(-20);save()}
 else if(d.noteclear){S.nota=null;save()}
 else if(d.demo){demo()}
 else if(d.day){U.day=+d.day}
 else if(d.addday){U.days=Math.min(7,(U.days||1)+1);U.day=U.days}
 else if(d.pw){PF();var kgv=parseFloat(document.getElementById('pw').value);if(!(kgv>20&&kgv<400))return;var dd=document.getElementById('pwd').value||today();S.pesos=S.pesos.filter(function(x){return x.d!==dd});S.pesos.push({d:dd,kg:Math.round(kgv*10)/10});S.pesos.sort(function(a,b){return a.d<b.d?-1:1});save()}
 else if(d.delpw){var pdt=d.delpw;ask('¿Borrar el registro de peso del '+fmt(pdt)+'?','Borrar',function(){PF();S.pesos=S.pesos.filter(function(x){return x.d!==pdt});save();draw()});return}
 else if(d.open){U.sel=d.open;U.tab='hoy';U.day=1;U.days=1;sync()}
 else if(d.back){U.sel=null;REF=null}
 else if(d.prev){U.prev=true;U.sel=null;REF=null;U.tab='hoy';U.day=1;U.days=1;S=norm({});S.name=''}
 else if(d.unprev){U.prev=false;U.sel=null;REF=null}
 else if(d.join){var nm=(document.getElementById('jn').value||'').trim();if(!nm)return;S=norm({name:nm});save()}
 else if(d.ren){var nn=prompt('Nombre del alumno',S.name||'');if(!nn||!nn.trim())return;S.name=nn.trim().slice(0,40);save()}
 else if(d.delal){var rr=REF;ask('¿Eliminar a '+(S.name||'este alumno')+' y todos sus registros? No se puede deshacer.','Eliminar',function(){wq=wq.then(function(){return rr.delete()}).catch(function(){});U.sel=null;REF=null;draw()});return}
 else if(d.clear){ask('Se borrarán tu rutina, todos tus registros y el historial de meses guardados. ¿Continuar?','Borrar todo',function(){S={name:S.name,start:today(),end:add(today(),34),routine:[],logs:[],meses:[]};save();draw()});return}
 else return;
 draw()});
document.addEventListener('change',function(ev){var id=ev.target.id,v=ev.target.value;
 if(id==='rd'&&v){U.rd=v;U.dr={}}
 else if(id==='cs'&&v){S.start=v;if(S.end<v)S.end=add(v,34);U.cfg=true;save()}
 else if(id==='ce'&&v){S.end=v<S.start?add(S.start,6):v;U.cfg=true;save()}
 else if(id.indexOf('pf_')===0){PF();var k=id.slice(3);if(k==='name')S.name=v.trim().slice(0,40);else S.perfil[k]=v.trim().slice(0,300);save();return}
 else if(id==='f_type'){U.f.type=v;return}
 else if(/^n\d+$/.test(id)){var ne=S.routine[+id.slice(1)];if(ne){ne.note=v.trim().slice(0,200);save()}return}
 else if(/^vd\d+$/.test(id)){var ve=S.routine[+id.slice(2)];if(ve){var vu=v.trim();if(vu&&!/^https:\/\/\S+$/i.test(vu)){U.err='El enlace del video debe empezar con https://';draw();return}ve.video=vu.slice(0,300);save()}return}
 else return;
 draw()});
document.addEventListener('change',function(ev){
 if(ev.target.id==='pf_avatar'){
  var file=ev.target.files&&ev.target.files[0];if(!file)return;
  if(!file.type||file.type.indexOf('image/')!==0){ask('Selecciona un archivo de imagen.','Entendido',null,true);return;}
  if(file.size>12*1024*1024){ask('La imagen supera 12 MB. Elige una más pequeña.','Entendido',null,true);ev.target.value='';return;}
  var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var max=192,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);var fin=function(u){PF();S.perfil.avatar=u;save();draw()},b64=function(){fin(c.toDataURL('image/jpeg',0.72))};b64();};img.onerror=function(){ask('No se pudo procesar la fotografía.','Entendido',null,true);};img.src=reader.result;};reader.readAsDataURL(file);
 }
});
document.addEventListener('input',function(ev){var id=ev.target.id;if(id==='f_name')U.f.name=ev.target.value;else if(id==='f_sets')U.f.sets=ev.target.value;else if(id==='f_target')U.f.target=ev.target.value;else if(/^[smk]\d+$/.test(id))U.dr[id]=ev.target.value});
document.addEventListener('toggle',function(ev){if(ev.target.tagName==='DETAILS'&&ev.target.getAttribute('data-cfg'))U.cfg=ev.target.open},true);
U.dr={};U.pw=0;U.rd=today();init();
window.addEventListener('online',function(){if(KIND==='student'&&getPend().length)save()});
function showUpd(){if(document.getElementById('upd'))return;var b=document.createElement('button');b.id='upd';b.type='button';b.textContent='Hay una versión nueva. Toca para actualizar';b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;padding:14px;border:0;border-radius:14px;background:#ff8a1f;color:#150800;font:700 15px Inter,system-ui,sans-serif;cursor:pointer';b.onclick=function(){location.reload()};document.body.appendChild(b)}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){var hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadSW){hadSW=true;return}showUpd()});window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
